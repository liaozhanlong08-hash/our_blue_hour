 if(!writable)return;
 try{localStorage.setItem(KEY,JSON.stringify(s))}
 catch(e){writable=false;$("#storage").textContent="当前无法保存，关闭后本次新增内容可能丢失。";toast("本地保存暂不可用，本次仍然可以体验。")}
}
function paint(){
 document.body.classList.toggle("night",s.night);
 $("#theme").textContent=s.night?"换成白天":"换成夜晚";
 $("#theme").setAttribute("aria-pressed",String(s.night));
 $("#scene-note").textContent="晚餐选了"+s.food+"，桌上还有"+s.snack+"。";
 $("#seed").setAttribute("fill",s.snack==="瓜子"?"#657785":s.snack==="松子"?"#cfb78e":"#e4d5ba");
}
$("#theme").onclick=()=>{s.night=!s.night;save();paint();toast(s.night?"灯留着，我们慢慢聊。":"天亮了，也可以一起发会儿呆。")};
$("#hug").onclick=()=>{
 if($("#hug").disabled)return;
 $("#hug").disabled=true;$("#room").classList.add("hugged");toast("有些话，抱一下就懂了。");
 clearTimeout(hugTimer);hugTimer=setTimeout(()=>{$("#room").classList.remove("hugged");$("#hug").disabled=false},2200);
};
function art(i){
 const start='<svg viewBox="0 0 120 95" shape-rendering="crispEdges" aria-hidden="true">';
 const drawings=[
 '<path fill="#c1d9e8" d="M0 0h120v95H0z"/><path fill="#c6aa97" d="M0 61h120v34H0z"/><path fill="#e3cdb9" d="M10 54h100v8H10z"/><path fill="#f1efe4" d="M41 45h38v27H41zM22 51h12v5H22zM88 51h12v5H88z"/><path fill="#718fa7" d="M37 42h46v5H37z"/><path fill="#d8ca98" d="M45 47h30v6H45z"/><path fill="#f4f1e5" d="M51 28h2v9h-2zM67 22h2v13h-2z"/>',
 '<path fill="#39536e" d="M0 0h120v95H0z"/><path fill="#dbe4e3" d="M15 12h90v47H15z"/><path fill="#86a6bf" d="M20 17h80v37H20z"/><path fill="#e9ddb5" d="M78 23h11v11H78z"/><path fill="#6688a5" d="M27 74h67v21H27z"/><path fill="#3c4a5b" d="M37 60h13v14H37zM68 59h14v17H68z"/><path fill="#e0bca6" d="M39 64h9v9h-9zM70 63h9v9h-9z"/><path fill="#9db9ce" d="M33 75h21v14H33z"/><path fill="#e2e5df" d="M64 75h22v14H64z"/>',
 '<path fill="#839fb8" d="M0 0h120v95H0z"/><path fill="#e5dcb5" d="M88 13h11v11H88z"/><path fill="#5f859b" d="M0 49h120v46H0z"/><path fill="#b5c6ce" d="M0 69h120v26H0z"/><path fill="#719580" d="M10 30h18v30H10z"/><path fill="#7f897e" d="M17 57h4v18h-4z"/><path fill="#405267" d="M50 48h11v12H50zM72 48h11v14H72zM52 77h4v12h-4zM58 77h4v12h-4zM74 77h4v12h-4zM80 77h4v12h-4z"/><path fill="#e3bfa9" d="M52 53h8v9h-8zM74 53h8v9h-8z"/><path fill="#6086a6" d="M48 63h17v15H48z"/><path fill="#e5e6de" d="M70 63h17v15H70z"/>'
 ];
 return start+drawings[i]+"</svg>";
}
function render(){
 const titles={date:"今晚的约会",talk:"再聊一会儿",photos:"我们的小相册",weekend:"下个周末"};
 $("#title").textContent=titles[page];
 let html="";
 if(page==="date"){
  html='<p class="hint">今天，把哪一道端上桌？</p><div class="grid">'+foods.map(f=>`<button class="choice ${s.food===f?"selected":""}" data-act="food" data-value="${f}" aria-pressed="${s.food===f}">${f}</button>`).join("")+'</div><div class="row"><span class="hint">桌上的小零食</span>'+snacks.map(n=>`<button class="chip ${s.snack===n?"selected":""}" data-act="snack" data-value="${n}" aria-pressed="${s.snack===n}">${n}</button>`).join("")+'</div><button class="quiet" data-act="random-food">选择困难？帮我们挑一道</button><hr><label for="films" class="hint">我们的待看片单 · 每行一部电影，可以随时修改</label><textarea id="films" maxlength="2400" placeholder="写下一部想一起看的电影">'+E(s.films)+'</textarea><div class="row"><button class="primary" data-act="film">今晚就看这一部</button></div><div id="film-result" class="result"></div>';
 }else if(page==="talk"){
  const p=poems[pi];
  html=`<p class="hint">问题只负责开场，答案留在你们的对话里。</p><div class="row"><button class="chip ${kind==="question"?"selected":""}" data-act="kind" data-value="question">一个话题</button><button class="chip ${kind==="poem"?"selected":""}" data-act="kind" data-value="poem">一页诗</button></div><div class="quote"><small>TAKE YOUR TIME</small><p>${E(kind==="question"?questions[qi]:p[0])}</p>${kind==="poem"?`<cite>${E(p[1])}</cite>`:""}</div><button class="primary" data-act="next">换一张，慢慢聊</button><p class="hint">聊不完的，明天继续也没关系。</p>`;
 }else if(page==="photos"){
  const names=["晚饭还有余温","电影散场以后","散步不要目的地"];
  html='<p class="hint">点照片翻面。三张都是场景示意，不是真实照片。</p><div class="gallery">'+s.captions.map((c,i)=>`<article><button class="photo" data-act="flip" aria-label="翻看：${names[i]}" aria-pressed="false"><span class="photo-inner"><span class="front">${art(i)}<small>${names[i]} · 示意</small></span><span class="back" id="back-${i}">${E(c)}</span></span></button><label class="caption">背面的小字<input type="text" maxlength="120" data-caption="${i}" value="${E(c)}"></label></article>`).join("")+"</div>";
 }else{
  html='<p class="hint">不用把周末排满，留一点时间一起发呆。</p><form class="add"><input name="wish" type="text" maxlength="120" required aria-label="想一起做的事" placeholder="例如：找一个公园，慢慢散步"><button class="primary">写下来</button></form>'+(s.notes.length?'<ul>'+s.notes.map((n,i)=>`<li class="${n.done?"done":""}"><label><input type="checkbox" data-check="${i}" ${n.done?"checked":""}><span>${E(n.text)}</span></label><button class="remove" data-act="delete" data-index="${i}" aria-label="删除 ${E(n.text)}">×</button></li>`).join("")+"</ul>":'<div class="empty">这里不赶进度。<br>先写下一件，想和对方一起做的小事。</div>')+'<p class="hint">勾选只是记录，不是任务考核。</p>';
 }
 $("#panel").innerHTML=html;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-open]");
 if(!b)return;
 page=b.dataset.open;
 if(page==="talk")kind=b.dataset.poem?"poem":"question";
 lastFocus=document.activeElement;render();
 if(!$("#dialog").open)$("#dialog").showModal();
});
$("#close").onclick=()=>$("#dialog").close();
$("#dialog").addEventListener("close",()=>{
 document.body.append($("#toast"));
 if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
});
$("#dialog").addEventListener("click",e=>{
 if(e.target!==$("#dialog"))return;
 const r=e.target.getBoundingClientRect();
 if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();
});
const next=(i,n)=>(i+1+Math.floor(Math.random()*(n-1)))%n;
$("#panel").addEventListener("click",e=>{
 const b=e.target.closest("button[data-act]");
 if(!b)return;
 const a=b.dataset.act,v=b.dataset.value,i=Number(b.dataset.index);
 if(a==="food"&&foods.includes(v)){s.food=v;save();paint();render();toast("好，今晚吃"+v+"。")}
 else if(a==="snack"&&snacks.includes(v)){s.snack=v;save();paint();render()}
 else if(a==="random-food"){s.food=foods[Math.floor(Math.random()*foods.length)];save();paint();render();toast("今晚就吃"+s.food+"吧。")}
 else if(a==="film"){
  const list=[...new Set(s.films.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
  if(!list.length){toast("先在片单里写一部电影吧。");return}
  $("#film-result").textContent="今晚："+list[Math.floor(Math.random()*list.length)];
 }
 else if(a==="kind"&&["question","poem"].includes(v)){kind=v;render()}
 else if(a==="next"){if(kind==="question")qi=next(qi,questions.length);else pi=next(pi,poems.length);render()}
 else if(a==="flip"){const flipped=b.classList.toggle("flipped");b.setAttribute("aria-pressed",String(flipped))}
 else if(a==="delete"&&Number.isInteger(i)&&i>=0&&i<s.notes.length){s.notes.splice(i,1);save();render()}
});
$("#panel").addEventListener("input",e=>{
 if(e.target.id==="films"){s.films=e.target.value.slice(0,2400);save()}
 if(e.target.hasAttribute("data-caption")){
  const i=Number(e.target.dataset.caption);
  if(!Number.isInteger(i)||i<0||i>2)return;
  s.captions[i]=e.target.value.slice(0,120);
  $("#back-"+i).textContent=s.captions[i];save();
 }
});
$("#panel").addEventListener("change",e=>{
 if(!e.target.hasAttribute("data-check"))return;
 const i=Number(e.target.dataset.check);
 if(!Number.isInteger(i)||!s.notes[i])return;
 s.notes[i].done=e.target.checked;
 e.target.closest("li").classList.toggle("done",e.target.checked);save();
});
$("#panel").addEventListener("submit",e=>{
 e.preventDefault();
 if(page!=="weekend")return;
 const text=String(new FormData(e.target).get("wish")||"").trim();
 if(!text){toast("先写几个字吧。");return}
 if(s.notes.length>=40){toast("先留四十件小事，慢慢来。");return}
 s.notes.push({text:text.slice(0,120),done:false});save();render();
 const field=$('input[name="wish"]');if(field)field.focus();
});
paint();
</script>
</body>
</html>
